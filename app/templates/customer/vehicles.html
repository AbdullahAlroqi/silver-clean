{% extends "base.html" %}

{% block content %}
<div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-white">مركباتي</h2>
    <a href="{{ url_for('customer.add_vehicle') }}"
        class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition">
        <i class="fas fa-plus ml-2"></i> إضافة مركبة
    </a>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    {% for vehicle in vehicles %}
    <div class="bg-primary p-4 rounded-lg shadow flex justify-between items-center">
        <div class="flex items-center gap-4">
            <div class="bg-gray-700 w-12 h-12 rounded-full flex items-center justify-center text-2xl">
                🚗
            </div>
            <div>
                <h3 class="font-bold text-white">{{ vehicle.brand }}</h3>
                <p class="text-gray-400">{{ vehicle.plate_number }}</p>
            </div>
        </div>
        <form action="{{ url_for('customer.delete_vehicle', id=vehicle.id) }}" method="post" style="display:inline;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <button type="submit" class="text-red-400 hover:text-red-300"
                onclick="return confirm('هل أنت متأكد من الحذف؟')">
                <i class="fas fa-trash"></i>
            </button>
        </form>
    </div>
    {% else %}
    <div class="col-span-full text-center text-gray-500 py-8">
        لا يوجد مركبات مضافة حالياً.
    </div>
    {% endfor %}
</div>

<div class="mt-6">
    <a href="{{ url_for('customer.index') }}"
        class="inline-block bg-gray-700 hover:bg-gray-600 text-white px-6 py-3 rounded-lg font-bold transition">
        <i class="fas fa-arrow-right mr-2"></i>رجوع
    </a>
</div>
{% endblock %}
