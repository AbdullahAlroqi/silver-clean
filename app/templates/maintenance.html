<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>الموقع في صيانة</title>
    <link rel="icon" type="image/png" href="{{ settings.logo_path or url_for('static', filename='images/logo.png') }}">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Tahoma, Arial, sans-serif;
            color: #ffffff;
            background: #1f1f1f;
        }

        main {
            width: min(520px, 100%);
            text-align: center;
            padding: 32px 24px;
        }

        img {
            width: 92px;
            height: 92px;
            object-fit: contain;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 6vw, 44px);
            line-height: 1.25;
        }

        p {
            margin: 0;
            color: #d1d5db;
            font-size: 17px;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <main>
        <img src="{{ settings.logo_path or url_for('static', filename='images/logo.png') }}" alt="">
        <h1>الموقع في صيانة</h1>
        <p>نعمل حالياً على تحديث الخدمة. الرجاء المحاولة لاحقاً.</p>
    </main>
</body>

</html>
