{% if current_user.is_authenticated %}
<div data-notification-card class="hidden mb-6 bg-gradient-to-r from-blue-700 to-cyan-600 rounded-2xl p-4 shadow-xl border border-white/20">
    <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center shrink-0">
            <i data-notification-icon class="fas fa-bell text-white text-2xl"></i>
        </div>
        <div class="min-w-0 flex-1">
            <h3 data-notification-title class="font-bold text-white">إشعارات الهاتف</h3>
            <p data-notification-status class="text-sm text-gray-200 leading-relaxed">جاري التحقق من حالة الإشعارات...</p>
        </div>
        <button type="button" data-enable-notifications
            class="bg-white text-blue-700 px-4 py-2 rounded-xl font-bold text-sm shrink-0 disabled:opacity-60">
            <span data-notification-label>تفعيل</span>
        </button>
    </div>
</div>
{% endif %}
